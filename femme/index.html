<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lahlou Diamond | Salon de Beauté</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            light: '#fcf3f6',
                            DEFAULT: '#d4af37', // Gold
                            dark: '#c5a028',
                            text: '#2d3748'
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            /* Elegant rose-gold/champagne gradient background */
            background: linear-gradient(135deg, #fdfbfb 0%, #f4eee8 100%);
            min-height: 100vh;
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-color: #d4af37; /* Gold accent on hover */
        }
        
        /* Staggered animation delays for buttons */
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }
    </style>
</head>
<body class="text-brand-text antialiased flex flex-col items-center py-12 px-4 selection:bg-brand selection:text-white">

    <div class="max-w-md w-full mx-auto relative z-10">
        
        <!-- Header Section -->
        <header class="flex flex-col items-center mb-10 animate-fade-in-up">
            <!-- Profile Image / Logo Area -->
            <div class="relative mb-5 group cursor-pointer">
                <div class="absolute inset-0 bg-brand rounded-full blur-md opacity-20 group-hover:opacity-40 transition-opacity duration-300"></div>
                <div class="w-28 h-28 rounded-full overflow-hidden border-4 border-white shadow-xl relative z-10 bg-white flex items-center justify-center">
                    <img src="https://i.postimg.cc/yNZw3hD1/IMG-0894.jpg" 
                         alt="Lahlou Diamond Logo" 
                         class="w-full h-full object-cover">
                </div>
            </div>

            <!-- Title & Subtitle -->
            <h1 class="text-3xl font-serif font-bold text-gray-900 tracking-wide mb-1 text-center flex items-center justify-center gap-2">
                Lahlou Diamond
                <svg class="w-6 h-6 text-brand" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 3h12l4 6-10 13L2 9Z"/>
                    <path d="M11 3 8 9l4 13"/>
                    <path d="M13 3l3 6-4 13"/>
                    <path d="M2 9h20"/>
                </svg>
            </h1>
            <p class="text-sm font-medium tracking-[0.2em] text-brand uppercase text-center">
                Salon de Beauté
            </p>
        </header>

        <!-- Links Container -->
        <main class="flex flex-col gap-4 w-full">
            
            <!-- WhatsApp (Bonus) -->
            <a href="#" class="glass-button w-full rounded-2xl py-4 px-6 flex items-center justify-between text-gray-800 font-semibold text-lg animate-fade-in-up opacity-0 delay-100">
                <span class="flex items-center gap-3">
                    <svg class="w-6 h-6 text-green-500" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                    Prendre RDV (WhatsApp)
                </span>
                <svg class="w-5 h-5 text-gray-400 group-hover:text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>

            <!-- Waze Link -->
            <a href="https://waze.com/ul/hevfwc76gs" target="_blank" rel="noopener noreferrer" class="glass-button w-full rounded-2xl py-4 px-6 flex items-center justify-between text-gray-800 font-semibold text-lg animate-fade-in-up opacity-0 delay-200">
                <span class="flex items-center gap-3">
                    <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    Localisation Waze
                </span>
                <svg class="w-5 h-5 text-gray-400 group-hover:text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>

            <!-- Google Reviews Link -->
            <a href="#" class="glass-button w-full rounded-2xl py-4 px-6 flex items-center justify-between text-gray-800 font-semibold text-lg animate-fade-in-up opacity-0 delay-300">
                <span class="flex items-center gap-3">
                    <svg class="w-6 h-6 text-yellow-500" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z"/>
                    </svg>
                    Google Reviews
                </span>
                <svg class="w-5 h-5 text-gray-400 group-hover:text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>

            <!-- WiFi Accordion -->
            <div class="animate-fade-in-up opacity-0 delay-400">
                <button onclick="toggleWifi()" class="glass-button w-full rounded-2xl py-4 px-6 flex items-center justify-between text-gray-800 font-semibold text-lg focus:outline-none">
                    <span class="flex items-center gap-3">
                        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path>
                        </svg>
                        Accès WiFi
                    </span>
                    <svg id="wifi-arrow" class="w-5 h-5 text-gray-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                
                <!-- Hidden WiFi Details -->
                <div id="wifi-content" class="hidden overflow-hidden transition-all duration-300 ease-in-out mt-2">
                    <div class="glass-button rounded-2xl p-5 border-t border-brand/20">
                        <div class="mb-3">
                            <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Réseau (SSID)</p>
                            <p class="font-medium text-gray-900">LAHLOU DIAMOND</p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Mot de passe</p>
                            <div class="flex items-center justify-between bg-white/50 rounded-lg p-3 border border-gray-100">
                                <span id="wifi-password" class="font-mono font-semibold tracking-wide text-brand-dark">Lahlou2026</span>
                                <button onclick="copyPassword()" class="text-xs bg-brand text-white px-3 py-1.5 rounded-md hover:bg-brand-dark transition-colors flex items-center gap-1 shadow-sm">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                    <span id="copy-text">Copier</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="mt-12 text-center pb-8 animate-fade-in-up opacity-0 delay-500">
            <p class="text-xs text-gray-400">© 2026 Lahlou Diamond. Tous droits réservés.</p>
        </footer>

    </div>

    <!-- Notification Toast (Hidden by default) -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium opacity-0 transition-opacity duration-300 pointer-events-none z-50">
        Mot de passe copié !
    </div>

    <script>
        // Toggle WiFi Information
        function toggleWifi() {
            const content = document.getElementById('wifi-content');
            const arrow = document.getElementById('wifi-arrow');
            
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                // Small delay to allow display:block to apply before animating opacity/transform
                setTimeout(() => {
                    content.classList.add('opacity-100', 'translate-y-0');
                    content.classList.remove('opacity-0', '-translate-y-2');
                }, 10);
                arrow.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        }

        // Copy WiFi Password
        function copyPassword() {
            const password = document.getElementById('wifi-password').innerText;
            const copyText = document.getElementById('copy-text');
            const toast = document.getElementById('toast');

            // Copy to clipboard
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(password);
            } else {
                // Fallback for older browsers or non-secure contexts (iframe)
                const textArea = document.createElement("textarea");
                textArea.value = password;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                } catch (err) {
                    console.error('Failed to copy', err);
                }
                document.body.removeChild(textArea);
            }

            // Visual feedback on button
            const originalText = copyText.innerText;
            copyText.innerText = 'Copié!';
            setTimeout(() => {
                copyText.innerText = originalText;
            }, 2000);

            // Show Toast Notification
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
