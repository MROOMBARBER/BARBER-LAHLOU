<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Lahlou - Liens</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap');

        body {
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .main-card {
            background-color: #0a0a0a;
            width: 100%;
            max-width: 400px;
            border-radius: 40px;
            padding: 45px 20px;
            border: 1px solid #1a1a1a;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            color: #ffffff;
            position: relative;
            overflow-x: hidden;
        }

        .gold-text {
            color: #d4af37;
            font-family: 'Playfair Display', serif;
            letter-spacing: 2px;
        }

        .logo-icon {
            font-size: 40px;
            color: #d4af37;
            margin-bottom: 15px;
        }

        /* --- BOUTONS BUBBLE --- */
        .link-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 16px 30px;
            margin-bottom: 18px;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1.5px;
            background-color: #0f0f0f;
            border: 2px solid transparent;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background-clip: padding-box, border-box;
            background-origin: padding-box, border-box;
        }

        .btn-whatsapp { background-image: linear-gradient(#0f0f0f, #0f0f0f), linear-gradient(45deg, #25d366, #128c7e, #25d366); color: #25d366; animation: pulse-whatsapp 2.5s infinite; }
        .btn-wifi { background-image: linear-gradient(#0f0f0f, #0f0f0f), linear-gradient(45deg, #ffffff, #888888, #ffffff); color: #ffffff; animation: pulse-wifi 3s infinite; }
        .btn-waze { background-image: linear-gradient(#0f0f0f, #0f0f0f), linear-gradient(45deg, #33f1ff, #00d4fe, #33f1ff); color: #33f1ff; animation: pulse-waze 2.7s infinite; }
        .btn-maps { background-image: linear-gradient(#0f0f0f, #0f0f0f), linear-gradient(45deg, #4285F4, #34A853, #FBBC05, #EA4335); color: #4285f4; animation: pulse-maps 2.8s infinite; }
        .btn-google { background-image: linear-gradient(#0f0f0f, #0f0f0f), linear-gradient(45deg, #4285F4, #EA4335, #FBBC05, #34A853); color: #ffffff; animation: pulse-google 2s infinite; }

        .link-btn:hover { transform: translateY(-5px) scale(1.03); filter: brightness(1.2); }
        .link-btn:active { transform: translateY(-2px) scale(0.95); }

        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes ripple-animation { to { transform: scale(4); opacity: 0; } }

        .icon-3d {
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
            transform: perspective(500px) rotateY(15deg);
            transition: transform 0.4s;
            margin-right: 20px;
            width: 30px;
            display: flex;
            justify-content: center;
        }
        .link-btn:hover .icon-3d { transform: perspective(500px) rotateY(0deg) scale(1.3); }

        .link-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            animation: rotate-shine 5s linear infinite;
            pointer-events: none;
        }
        @keyframes rotate-shine { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        @keyframes pulse-whatsapp { 0%, 100% { box-shadow: 0 0 5px rgba(37, 211, 102, 0.2); } 50% { box-shadow: 0 0 15px rgba(37, 211, 102, 0.4); } }
        @keyframes pulse-wifi { 0%, 100% { box-shadow: 0 0 5px rgba(255, 255, 255, 0.1); } 50% { box-shadow: 0 0 12px rgba(255, 255, 255, 0.2); } }
        @keyframes pulse-waze { 0%, 100% { box-shadow: 0 0 5px rgba(0, 212, 254, 0.2); } 50% { box-shadow: 0 0 18px rgba(0, 212, 254, 0.4); } }
        @keyframes pulse-maps { 0%, 100% { box-shadow: 0 0 5px rgba(66, 133, 244, 0.2); } 50% { box-shadow: 0 0 15px rgba(66, 133, 244, 0.4); } }
        @keyframes pulse-google { 0%, 100% { box-shadow: 0 0 5px rgba(251, 188, 5, 0.2); } 50% { box-shadow: 0 0 20px rgba(251, 188, 5, 0.5); } }

        /* --- GALERIE --- */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 25px;
            padding: 0 5px;
        }

        .gallery-item {
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            border: 1.5px solid #d4af37;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .gallery-item:hover { transform: scale(1.1); z-index: 5; box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

        .divider {
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #333, transparent);
            margin: 25px auto;
        }

        .footer-text {
            font-size: 10px;
            color: #444;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- LIGHTBOX SLIDER --- */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.98);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            touch-action: none;
        }

        .lightbox-content {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 75vh;
            border-radius: 20px;
            border: 2px solid #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            user-select: none;
            transition: transform 0.3s ease;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #d4af37;
            font-size: 35px;
            cursor: pointer;
            padding: 15px;
            z-index: 110;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .nav-arrow:hover { opacity: 1; }
        .arrow-prev { left: 10px; }
        .arrow-next { right: 10px; }

        .lightbox-dots {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            transition: all 0.3s;
        }
        .dot.active {
            background: #d4af37;
            transform: scale(1.5);
            box-shadow: 0 0 10px #d4af37;
        }

        .close-btn {
            position: absolute;
            top: 40px;
            right: 25px;
            font-size: 30px;
            color: #fff;
            cursor: pointer;
            opacity: 0.5;
        }

        /* Modal WiFi */
        #wifi-modal {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.98);
            border-radius: 40px;
            z-index: 50;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        .wifi-info-box {
            border: 2px solid #d4af37;
            padding: 25px;
            border-radius: 25px;
            width: 85%;
            background: #050505;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- Section Logo -->
        <div class="header-section">
            <div class="logo-icon">
                <i class="fas fa-scissors"></i>
            </div>
            <h1 class="gold-text text-3xl font-bold mb-1">BARBER LAHLOU</h1>
            <p class="gold-text text-xs tracking-[0.3em] opacity-80 uppercase">BARBERSHOP</p>
            <p class="text-[10px] text-gray-500 mt-2 uppercase font-semibold">CASABLANCA</p>
        </div>

        <div class="divider"></div>

        <!-- Section Liens -->
        <div class="links-container">
            <a href="https://wa.me/212614660292" class="link-btn btn-whatsapp" target="_blank">
                <div class="icon-3d"><i class="fab fa-whatsapp text-xl"></i></div>
                <span>WHATSAPP</span>
            </a>

            <button onclick="toggleWifi()" class="link-btn btn-wifi">
                <div class="icon-3d"><i class="fas fa-wifi"></i></div>
                <span>WIFI GRATUIT</span>
            </button>

            <a href="https://www.google.com/maps?hl=fr&um=1&ie=UTF-8&fb=1&gl=ma&sa=X&geocode=KZEw12a5LaYNMa8vwq2lJLo4&daddr=BARBER+LAHLOU,+OULFA+SALOUANE,+Casablanca+20400" class="link-btn btn-maps" target="_blank">
                <div class="icon-3d">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                </div>
                <span>GOOGLE MAPS</span>
            </a>

            <a href="https://waze.com/ul/hevfwc76gs" class="link-btn btn-waze" target="_blank">
                <div class="icon-3d"><i class="fab fa-waze text-xl"></i></div>
                <span>WAZE NAVIGATION</span>
            </a>

            <a href="https://www.google.com/search?q=avis+sur+barber+lahlou+casablanca&si=AL3DRZEsmMGCryMMFSHJ3StBhOdZ2-6yYkXd_doETEE1OR-qOekMCUEfm0_0GKGWMNcRkFF-GUING27i-P1LlsDBXJn7P7YB4arTqiU6IDs4I7iOzO_Vng2jn31KwAgJnIP5KXcN2U2fzVnIL6KwoywoexDAuXic8g%3D%3D" class="link-btn btn-google" target="_blank">
                <div class="icon-3d">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                </div>
                <div class="text-left">
                    <span class="block">LAISSER UN AVIS</span>
                    <div class="flex text-[8px] text-[#FBBC05] mt-1">★★★★★</div>
                </div>
            </a>
        </div>

        <div class="divider"></div>

        <!-- Section Galerie -->
        <h3 class="gold-text text-[10px] uppercase tracking-[0.4em] mb-4 opacity-70">NOTRE TRAVAIL</h3>
        <div class="gallery-container">
            <div class="gallery-item" onclick="openLightbox(0)">
                <img src="https://i.postimg.cc/wjV9BGcv/photo-5883975969003998512-x.jpg" alt="Style 1">
            </div>
            <div class="gallery-item" onclick="openLightbox(1)">
                <img src="https://i.postimg.cc/3xB3wcC0/photo-5883975969003998513-w.jpg" alt="Style 2">
            </div>
            <div class="gallery-item" onclick="openLightbox(2)">
                <img src="https://i.postimg.cc/4x5X3SbY/photo-5883975969003998514-y.jpg" alt="Style 3">
            </div>
        </div>

        <p class="footer-text">© 2026 BARBER LAHLOU | ALL RIGHTS RESERVED</p>

        <!-- Lightbox Slider -->
        <div id="lightbox">
            <div class="close-btn" onclick="closeLightbox()">&times;</div>
            <div class="lightbox-content" id="lightbox-container">
                <div class="nav-arrow arrow-prev" onclick="changeImage(-1)"><i class="fas fa-chevron-left"></i></div>
                <img id="lightbox-img" src="" alt="Gallery Image">
                <div class="nav-arrow arrow-next" onclick="changeImage(1)"><i class="fas fa-chevron-right"></i></div>
            </div>
            <div class="lightbox-dots" id="lightbox-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <p class="text-[10px] text-gray-500 mt-6 tracking-widest uppercase opacity-40">GLISSER POUR DÉFILER</p>
        </div>

        <!-- Modal WiFi -->
        <div id="wifi-modal">
            <h2 class="gold-text text-2xl mb-8">ACCÈS WIFI</h2>
            <div class="wifi-info-box space-y-6 mb-10 text-center">
                <div>
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Réseau</p>
                    <p class="font-bold text-white text-lg tracking-wider">BARBER LAHLOU PRO</p>
                </div>
                <div onclick="copyToClipboard('driss1234')" class="cursor-pointer group">
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Mot de passe (Tap to copy)</p>
                    <div class="flex items-center justify-center gap-3 bg-white/5 p-4 rounded-full group-hover:bg-white/10 transition">
                        <p id="wifi-pass" class="font-bold text-white text-xl tracking-widest">driss1234</p>
                        <i class="far fa-copy text-amber-500"></i>
                    </div>
                    <p id="copy-msg" class="text-[11px] text-[#25d366] mt-2 font-bold opacity-0 transition">Copié !</p>
                </div>
            </div>
            <button onclick="toggleWifi()" class="text-xs text-white border border-white/20 px-10 py-3 rounded-full hover:bg-white hover:text-black font-bold transition">FERMER</button>
        </div>
    </div>

    <script>
        // Images Array
        const images = [
            "https://i.postimg.cc/wjV9BGcv/photo-5883975969003998512-x.jpg",
            "https://i.postimg.cc/3xB3wcC0/photo-5883975969003998513-w.jpg",
            "https://i.postimg.cc/4x5X3SbY/photo-5883975969003998514-y.jpg"
        ];
        let currentIdx = 0;

        // Lightbox Functions
        function openLightbox(idx) {
            currentIdx = idx;
            updateLightbox();
            document.getElementById('lightbox').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function changeImage(step) {
            currentIdx = (currentIdx + step + images.length) % images.length;
            updateLightbox();
        }

        function updateLightbox() {
            const img = document.getElementById('lightbox-img');
            img.style.opacity = '0';
            setTimeout(() => {
                img.src = images[currentIdx];
                img.style.opacity = '1';
            }, 150);

            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIdx);
            });
        }

        // SWIPE DETECTION
        let touchStartX = 0;
        const lightboxElem = document.getElementById('lightbox');

        lightboxElem.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        lightboxElem.addEventListener('touchend', (e) => {
            let touchEndX = e.changedTouches[0].screenX;
            let diff = touchStartX - touchEndX;

            if (Math.abs(diff) > 50) { // Threshold
                if (diff > 0) changeImage(1); // Left swipe -> Next
                else changeImage(-1);         // Right swipe -> Prev
            }
        }, false);

        // Keyboard support
        window.addEventListener('keydown', (e) => {
            if (document.getElementById('lightbox').style.display === 'flex') {
                if (e.key === 'ArrowRight') changeImage(1);
                if (e.key === 'ArrowLeft') changeImage(-1);
                if (e.key === 'Escape') closeLightbox();
            }
        });

        // Other Utilities
        function toggleWifi() {
            const m = document.getElementById('wifi-modal');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        function copyToClipboard(t) {
            const el = document.createElement("textarea");
            el.value = t; document.body.appendChild(el);
            el.select(); document.execCommand('copy');
            document.body.removeChild(el);
            const msg = document.getElementById('copy-msg');
            msg.style.opacity = '1';
            setTimeout(() => { msg.style.opacity = '0'; }, 2000);
        }

        // Ripple Effect
        document.querySelectorAll('.link-btn').forEach(b => {
            b.addEventListener("click", function(e) {
                const circle = document.createElement("span");
                const rect = this.getBoundingClientRect();
                const d = Math.max(this.clientWidth, this.clientHeight);
                circle.style.width = circle.style.height = `${d}px`;
                circle.style.left = `${e.clientX - rect.left - d/2}px`;
                circle.style.top = `${e.clientY - rect.top - d/2}px`;
                circle.classList.add("ripple");
                const old = this.querySelector('.ripple');
                if (old) old.remove();
                this.appendChild(circle);
            });
        });
    </script>
</body>
</html>
